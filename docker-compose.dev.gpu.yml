services:
  manga-colorizer-dev-gpu:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      args:
        BUILD_TYPE: gpu
    
    container_name: manga-colorizer-dev-gpu
    
    # NVIDIA Container Runtime
    runtime: nvidia
    
    ports:
      - "5000:5000"
    
    environment:
      # Device selection
      - DEVICE=cuda
      
      # Model paths (relative to /app in container)
      - COLORIZER_PATH=networks/generator.zip
      - UPSCALER_PATH=networks/RealESRGAN_x4plus_anime_6B.pt
      - EXTRACTOR_PATH=networks/extractor.pth
      
      # SSL configuration (disabled for local dev)
      - SSL_ENABLED=false
      
      # Python unbuffered output for better logging
      - PYTHONUNBUFFERED=1
      
      # NVIDIA specific
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    volumes:
      # Mount source code for live development
      # Changes to Python files will be reflected without rebuild
      - ./Backend:/app
      
      # Mount cache directory for processed images (persistent)
      - manga-cache-dev-gpu:/app/manga
      
      # Optional: Override input/output directories
      # - ./dev-input:/app/input
      # - ./dev-output:/app/output
    
    # Auto-restart on failure
    restart: unless-stopped
    
    # Development command with auto-reload
    command: python app-stream.py --device cuda --no-ssl
    
    # GPU resource allocation
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Healthcheck with shorter intervals for dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  manga-cache-dev-gpu:
    driver: local
