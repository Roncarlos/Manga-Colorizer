services:
  manga-colorizer-dev:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      args:
        BUILD_TYPE: cpu  # Change to 'gpu' for GPU development
    
    container_name: manga-colorizer-dev
    
    # Uncomment for GPU development (requires nvidia-docker)
    # runtime: nvidia
    
    ports:
      - "5000:5000"
    
    environment:
      # Device selection: 'cpu' or 'cuda'
      - DEVICE=cpu
      
      # Model paths (relative to /app in container)
      - COLORIZER_PATH=networks/generator.zip
      - UPSCALER_PATH=networks/RealESRGAN_x4plus_anime_6B.pt
      - EXTRACTOR_PATH=networks/extractor.pth
      
      # SSL configuration (disabled for local dev)
      - SSL_ENABLED=false
      
      # Python unbuffered output for better logging
      - PYTHONUNBUFFERED=1
    
    volumes:
      # Mount source code for live development
      # Changes to Python files will be reflected without rebuild
      - ./Backend:/app
      
      # Tones directory is already mounted via ./Backend:/app mount above
      
      # Mount cache directory for processed images (persistent)
      - manga-cache-dev:/app/manga
      
      # Optional: Override input/output directories
      # - ./dev-input:/app/input
      # - ./dev-output:/app/output
    
    # Auto-restart on failure
    restart: unless-stopped
    
    # Development command with auto-reload
    # Uses Flask's debug mode for auto-reloading on code changes
    command: python app-stream.py --device cpu --no-ssl
    
    # Uncomment for GPU development
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    # Healthcheck with shorter intervals for dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  manga-cache-dev:
    driver: local

